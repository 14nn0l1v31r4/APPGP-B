services:
  api:
    build: .
    container_name: appgp_api
    restart: always

    ports:
      - "8000:8000"

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TESSERACT_CMD=/usr/bin/tesseract

    networks:
      - database_network

    deploy:
      resources:
        limits:
          memory: 300M

networks:
  database_network:
    external: true
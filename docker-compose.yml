version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: appgp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: appgp_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TESSERACT_CMD=/usr/bin/tesseract
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 300M

volumes:
  postgres_data: